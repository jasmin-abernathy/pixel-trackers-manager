name: PTM one-time Plugin Check autofix

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/plugin-check-autofix-once.yml'

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply audited fixes
        run: python3 .github/scripts/plugin-check-autofix.py

      - name: Validate modified files
        shell: bash
        run: |
          set -euo pipefail
          php -l pixel-trackers-manager.php
          php -l includes/class-pixel-trackers-manager-consent.php
          node --check assets/consent-bootstrap.js
          node --check assets/consent.js
          git diff --check
          git diff --stat

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Jasmin-potager'
          git config user.email 'jasmin@lepotager.org'
          git add pixel-trackers-manager.php includes/class-pixel-trackers-manager-consent.php assets/consent-bootstrap.js
          git commit -m 'fix: address WordPress Plugin Check findings'
          git push origin HEAD:master
